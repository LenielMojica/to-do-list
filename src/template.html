<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Todo App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Projects</h2>
        </div>
        <ul id="project-list" class="project-list">
          <li class="project-item active">Inbox</li>
          <li class="project-item">Work</li>
          <li class="project-item">Groceries</li>
        </ul>
        <button id="add-project-btn" class="btn btn-secondary">
          + New Project
        </button>
      </aside>

      <main class="main-content">
        <header class="main-header">
          <h1 id="current-project-title">Inbox</h1>
          <button id="add-todo-btn" class="btn btn-primary">+ Add Task</button>
        </header>

        <div id="todo-container" class="todo-container">
          <div class="todo-card">
            <div class="todo-left">
              <input type="checkbox" class="todo-checkbox" />
              <span class="todo-title">Sample Todo Task</span>
            </div>
            <div class="todo-right">
              <span class="todo-date">2026-10-15</span>
              <span class="priority-badge high">High</span>
              <button class="btn-delete">🗑️</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="todo-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Add New Task</h2>
        <form id="todo-form">
          <label for="title">Title</label>
          <input type="text" id="title" required />

          <label for="description">Description</label>
          <textarea id="description" rows="3"></textarea>

          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" required />

          <label for="priority">Priority</label>
          <select id="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>

          <div class="modal-actions">
            <button type="button" id="cancel-btn" class="btn btn-secondary">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Task</button>
          </div>
        </form>
      </div>
    </div>

    <script src="index.js" type="module"></script>
  </body>
</html>
